name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: production-site
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/validation.yml
    secrets: inherit
  build:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - run: uv --no-config sync --locked
      - uses: wakamex/release-actions/verify-release-tag@stable
        with:
          version-command: uv --no-config version --short
      - name: Build the released site from fresh inputs
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: uv --no-config run --locked python -m rb.release build --tag "$GITHUB_REF_NAME" --output reports/release-site
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-site
          path: reports/release-site/
          if-no-files-found: error
          retention-days: 90
  release:
    needs: build
    permissions:
      contents: write
    uses: wakamex/release-actions/.github/workflows/github-release.yml@stable
  deploy:
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: [build, release]
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-site
          path: site
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/ --project-name=redvsblue --branch=main
