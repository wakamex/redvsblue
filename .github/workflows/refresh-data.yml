name: refresh-data
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-site
  cancel-in-progress: false
jobs:
  refresh:
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - run: uv --no-config sync --locked
      - name: Resolve and verify the deployed release
        id: deployed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv --no-config run --locked python -m rb.release resolve >> "$GITHUB_OUTPUT"
      - name: Check out the deployed code
        env:
          RELEASE_COMMIT: ${{ steps.deployed.outputs.commit }}
          RELEASE_TAG: ${{ steps.deployed.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft == false' | grep -qx true
          git checkout --detach "$RELEASE_COMMIT"
          uv --no-config sync --locked
      - run: uv --no-config run --locked pytest -q
      - name: Rebuild with the deployed code and fresh inputs
        env:
          RELEASE_TAG: ${{ steps.deployed.outputs.tag }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: uv --no-config run --locked python -m rb.release build --tag "$RELEASE_TAG" --output reports/refreshed-site
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refreshed-site
          path: reports/refreshed-site/
          if-no-files-found: error
          retention-days: 90
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy reports/refreshed-site/ --project-name=redvsblue --branch=main
