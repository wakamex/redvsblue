name: validation
on:
  workflow_call:
    secrets:
      FRED_API_KEY:
        required: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - run: uv --no-config sync --locked
      - run: uv --no-config run --locked pytest -q
      - name: Build and validate the complete site
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: uv --no-config run --locked python -m rb.release build --output reports/validation-site
