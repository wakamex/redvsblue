name: deploy-site
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful publish workflow run containing the release-site artifact
        required: true
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: production-site
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - run: uv --no-config sync --locked
      - name: Verify successful release build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/release-run.json"
          jq -e '.path == ".github/workflows/publish.yml" and .event == "push" and .conclusion == "success"' "$RUNNER_TEMP/release-run.json"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-site
          path: reports/deploy-site
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify artifact identity and released data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv --no-config run --locked python -m rb.release verify-artifact --site reports/deploy-site --run "$RUNNER_TEMP/release-run.json"
          RELEASE_TAG=$(jq -r .tag reports/deploy-site/version.json)
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft == false' | grep -qx true
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy reports/deploy-site/ --project-name=redvsblue --branch=main
