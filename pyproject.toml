[project]
name = "rb"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "certifi>=2026.1.4",
    "openpyxl>=3.1.5",
    "pdfminer-six>=20260107",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=8",
]

[project.scripts]
rb = "rb.cli:main"

[tool.uv]
# Make `uv sync` install this project (and its entrypoints) into `.venv/`.
package = true

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["rb*"]
